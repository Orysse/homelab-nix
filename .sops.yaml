# Secrets du socle (sops-nix). Chaque secret est chiffré pour l'admin ET pour la machine
# qui le consomme (sa clé SSH d'hôte convertie en age : `ssh-to-age < ssh_host_ed25519_key.pub`).
# Clés admin : les mêmes que nix-secrets — clé age logicielle (~/.config/sops/age/keys.txt,
# elle-même chiffrée pour la YubiKey dans nix-secrets/secrets/user-age-key.yaml) + YubiKey.
keys:
  - &abel_age age1uzjc82ya0szkyht2txxjsk03csk7cpap524lz9v8gjxsaqxlaejsr3tkcc
  - &abel_yubikey age1yubikey1q23p5ysmjm8ukvad9xefunvaq7fz06zsf72jr0vj20z2j48sjjh2jm256cs
  - &nuc1 age1phrk939luastwkp4qy2lvryhu03pwc66wx4ke55ymw457fssqelq2g8j9u
creation_rules:
  - path_regex: secrets/nuc1\.yaml$
    key_groups:
      - age: [*abel_age, *abel_yubikey, *nuc1]
